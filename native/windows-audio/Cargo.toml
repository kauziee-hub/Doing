[package]
name = "hirora-audio"
version = "0.2.0"
edition = "2021"
description = "Hirora native Windows audio helper: WASAPI microphone + loopback capture streamed over a framed stdout protocol."
license = "UNLICENSED"
publish = false

[[bin]]
name = "hirora-audio"
path = "src/main.rs"

[lib]
name = "hirora_audio"
path = "src/lib.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.27"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_Media_Audio",
  "Win32_System_Threading",
  "Win32_System_Performance",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_ProcessStatus",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
