# All runtime code is bundled by electron-vite. The one runtime dependency is onnxruntime-node
# (native, for the SAVA turn model): only its Windows x64 CPU build is packaged.
appId: app.hirora.desktop
productName: Doing
copyright: Copyright © 2026 Doing contributors
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - "!**/*.map"
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**"
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"
  - "!**/node_modules/onnxruntime-node/script/**"
  # SAVA runs on the CPU execution provider: the DirectML (GPU) libraries aren't needed.
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/DirectML.dll"
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/dxcompiler.dll"
asar: true
extraResources:
  - from: resources/desktop-control.ps1
    to: desktop-control.ps1
  - from: resources/browser-extension
    to: browser-extension
  - from: ../../native/windows-audio/target/release/doing-audio.exe
    to: bin/doing-audio.exe
  - from: resources/icon.png
    to: icon.png
  - from: resources/tray.png
    to: tray.png
  - from: resources/tray@2x.png
    to: tray@2x.png
  - from: resources/sava
    to: sava
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  executableName: Doing
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Doing
  uninstallDisplayName: Doing
  deleteAppDataOnUninstall: false
  artifactName: Doing-Setup-${version}-x64-unsigned.${ext}
electronLanguages: [en-US]
publish: null
